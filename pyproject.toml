[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "wood-plan"
version = "0.1.0"
description = "Text-based woodworking project planner with cut-list optimizer and HTML visualization"
requires-python = ">=3.9"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
woodplan = "woodplan.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["woodplan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
